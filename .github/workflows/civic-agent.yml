name: Civic Source Agent

on:
  workflow_run:
    workflows: ['Hourly Toronto notice sync']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/civic-agent.yml'
      - '.nvmrc'
      - '.env.local.example'
      - 'scripts/setup-env.mjs'
      - 'scripts/civic-agent.mjs'
      - 'lib/civic-agent/**'
      - 'tests/civic-agent.test.mjs'
      - 'supabase/migrations/*_civic_agent_ingestion.sql'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('civic-agent-pr-{0}', github.ref) || 'toronto-source-pipeline' }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'TOBEDAYDAYUP/civic-hack-2026-clean' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test agent
        run: node --test tests/civic-agent.test.mjs
      - name: Verify official motion pages from GitHub
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { getOfficialMotions } from './lib/civic-agent/official-motions.mjs';

          for (const reference of ['2026.BL43.1', '2026.EC27.2', '2026.TTC17.1']) {
            const motions = await getOfficialMotions(reference, reference);
            assert.ok(motions.length && motions.some(({ payload }) => payload.motion_text), reference);
            assert.ok(motions.every(({ payload }) =>
              ['yes', 'no', 'absent'].every((key) => Number.isInteger(payload[key]))), reference);
            console.log(reference, motions.length, 'official votes with verified totals');
          }
          JS
      - name: Configure public notice access
        run: node scripts/setup-env.mjs
      - name: Collect and validate public records
        if: github.event_name == 'pull_request'
        run: node --env-file=.env.local scripts/civic-agent.mjs --source=notices
      - name: Write to Supabase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://johoelklvlszzjgrkudw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.CIVIC_AGENT_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure CIVIC_AGENT_SUPABASE_SECRET_KEY in GitHub Actions secrets."
            exit 1
          fi
          node --env-file=.env.local scripts/civic-agent.mjs --source=notices --write
