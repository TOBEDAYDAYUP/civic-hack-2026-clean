name: Civic Source Agent

on:
  workflow_run:
    workflows: ['Hourly Toronto notice sync']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/civic-agent.yml'
      - '.nvmrc'
      - '.env.local.example'
      - 'scripts/setup-env.mjs'
      - 'scripts/civic-agent.mjs'
      - 'lib/civic-agent/**'
      - 'tests/civic-agent.test.mjs'
      - 'supabase/migrations/*_civic_agent_ingestion.sql'
      - 'supabase/migrations/*_civic_agenda_snapshot.sql'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('civic-agent-pr-{0}', github.ref) || 'toronto-source-pipeline' }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'TOBEDAYDAYUP/civic-hack-2026-clean' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test agent
        run: node --test tests/civic-agent.test.mjs
      - name: Configure public notice access
        run: node scripts/setup-env.mjs
      - name: Collect and validate public records
        if: github.event_name == 'pull_request'
        run: node --env-file=.env.local scripts/civic-agent.mjs
      - name: Write to Supabase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://johoelklvlszzjgrkudw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.CIVIC_AGENT_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure CIVIC_AGENT_SUPABASE_SECRET_KEY in GitHub Actions secrets."
            exit 1
          fi
          node --env-file=.env.local scripts/civic-agent.mjs --write
      - name: Validate upcoming Toronto agendas
        if: github.event_name == 'pull_request'
        run: node scripts/civic-agent.mjs --source=agendas
      - name: Refresh the public agenda snapshot
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SUPABASE_URL: https://johoelklvlszzjgrkudw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.CIVIC_AGENT_SUPABASE_SECRET_KEY }}
        run: node scripts/civic-agent.mjs --source=agendas --write
