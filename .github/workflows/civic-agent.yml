name: Civic Source Agent

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/civic-agent.yml'
      - '.nvmrc'
      - '.env.local.example'
      - 'scripts/setup-env.mjs'
      - 'scripts/civic-agent.mjs'
      - 'lib/civic-agent/**'
      - 'tests/civic-agent.test.mjs'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test agent
        run: node --test tests/civic-agent.test.mjs
      - name: Configure public notice access
        run: node scripts/setup-env.mjs
      - name: Collect and validate public records
        run: node --env-file=.env.local scripts/civic-agent.mjs
